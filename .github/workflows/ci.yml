name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - name: Privacy gate (no home paths, phone numbers or private emails)
        run: python tools/privacy_gate.py
      - run: python -m pytest -q
      - name: Build and install the wheel
        run: |
          python -m build --wheel
          python -m pip install dist/*.whl
          zeus --version
          HOME="$RUNNER_TEMP/fakehome" zeus doctor --json > /dev/null || true
