<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>What Zeus knows</title>
<style nonce="{{NONCE}}">
:root{--bg:#f6f6f4;--fg:#1c1c1e;--mute:#6b6b70;--card:#fff;--line:#d9d9dc;--acc:#1f6feb;--accfg:#fff;--warn:#9a5b00;--ok:#16794a;--quote:#3a3a3f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--fg:#ececee;--mute:#9a9aa2;--card:#1c1c1f;--line:#34343a;--acc:#4c8dff;--accfg:#fff;--warn:#ffcf7a;--ok:#5fd39a;--quote:#d4d4da}}
:root[data-theme="dark"]{--bg:#111113;--fg:#ececee;--mute:#9a9aa2;--card:#1c1c1f;--line:#34343a;--acc:#4c8dff;--accfg:#fff;--warn:#ffcf7a;--ok:#5fd39a;--quote:#d4d4da}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:600px;margin:0 auto;padding:12px 16px 36px}
h1{font-size:24px;margin:18px 0 6px}
h2{font-size:19px;margin:26px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
h3{font-size:15px;margin:14px 0 6px;color:var(--mute);font-weight:600;text-transform:none}
p{margin:6px 0}
.small,.none{font-size:15px;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.item .what{font-weight:600;margin:0 0 4px}
.item .said{color:var(--quote);font-style:italic;margin:4px 0;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--mute);margin:2px 0}
.item.done{opacity:.6}
ul.plain li{padding:6px 0;border-bottom:1px solid var(--line)}
ul.plain li:last-child{border-bottom:0}
ul.plain .what{font-weight:500;margin:0}
details{margin:8px 0}
details summary{cursor:pointer;padding:8px 0;font-weight:600;min-height:40px}
details.who{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 12px}
details.who p{font-size:15px;margin:4px 0 8px}
.acts,.sure{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer;touch-action:manipulation;flex:1}
button:active{opacity:.7}
button.yes{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:600}
button.big{display:block;width:100%;font-size:19px;font-weight:600;padding:14px;margin:16px 0 6px;background:var(--acc);color:var(--accfg);border-color:transparent}
button:disabled{opacity:.5}
.sure p{flex-basis:100%;margin:0;font-size:15px}
.res{font-size:15px;margin:6px 0 0;min-height:0}
.res.ok{color:var(--ok);font-weight:600}
.res.warn{color:var(--warn)}
.foot{margin-top:24px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>What Zeus knows</h1>
  <div id="intro">
    <p>What Zeus has learned from you, the rules it follows, the people it knows, and anything waiting on you.</p>
    <p class="small">Nothing shows until you tap Show.</p>
    <button id="show" class="big" type="button">Show</button>
    <p id="shownote" class="small" role="status"></p>
    <p class="small">This link works until {{UNTIL}}.</p>
  </div>
  <div id="body" hidden></div>
</main>
<script nonce="{{NONCE}}">
(function(){
  var base = location.pathname.replace(/\/+$/, '');
  function post(path, data){
    return fetch(base + path, {method:'POST', headers:{'Content-Type':'application/json','X-Handoff':'1'},
                               body: JSON.stringify(data||{}), credentials:'omit', cache:'no-store'})
      .then(function(r){ return r.json().catch(function(){ return {ok:false, words:'Something went wrong. Try again.'}; })
                                 .then(function(j){ j._status = r.status; return j; }); });
  }
  var showBtn = document.getElementById('show'), note = document.getElementById('shownote');
  var body = document.getElementById('body'), intro = document.getElementById('intro');
  function show(){
    showBtn.disabled = true; note.textContent = 'Loading...';
    post('/show').then(function(j){
      if (j._status === 404) { location.reload(); return; }
      if (!j.ok) { note.textContent = j.words || 'Something went wrong. Try again.'; showBtn.disabled = false; return; }
      body.innerHTML = j.html; body.hidden = false; intro.hidden = true;
    }, function(){ note.textContent = 'No connection. Try again.'; showBtn.disabled = false; });
  }
  showBtn.addEventListener('click', show);
  function result(li, text, kind){
    var r = li.querySelector('.res'); if (!r) return;
    r.textContent = text || ''; r.className = 'res' + (kind ? ' ' + kind : '');
  }
  function restore(li){
    var s = li.querySelector('.sure'); if (s) s.remove();
    var a = li.querySelector('.acts'); if (a) a.hidden = false;
  }
  body.addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    var li = b.closest('li.item'); if (!li || li.classList.contains('busy')) return;
    var id = li.getAttribute('data-id'), ver = li.getAttribute('data-ver');
    if (b.hasAttribute('data-act')) {
      var act = b.getAttribute('data-act');
      li.classList.add('busy'); result(li, '');
      post('/act', {id:id, act:act, ver:ver}).then(function(j){
        li.classList.remove('busy');
        if (!j.ok) { result(li, j.words, 'warn'); return; }
        var acts = li.querySelector('.acts'); acts.hidden = true;
        var s = document.createElement('div'); s.className = 'sure';
        var p = document.createElement('p'); p.textContent = j.ask; s.appendChild(p);
        var yes = document.createElement('button'); yes.type = 'button'; yes.className = 'yes'; yes.textContent = 'Yes';
        yes.setAttribute('data-yes', act); yes.setAttribute('data-confirm', j.confirm);
        var no = document.createElement('button'); no.type = 'button'; no.textContent = 'Keep it'; no.setAttribute('data-no', '1');
        s.appendChild(yes); s.appendChild(no); acts.after(s);
      }, function(){ li.classList.remove('busy'); result(li, 'No connection. Try again.', 'warn'); });
    } else if (b.hasAttribute('data-no')) {
      restore(li); result(li, '');
    } else if (b.hasAttribute('data-yes')) {
      li.classList.add('busy'); b.disabled = true;
      post('/act', {id:id, act:b.getAttribute('data-yes'), ver:ver, confirm:b.getAttribute('data-confirm')}).then(function(j){
        li.classList.remove('busy');
        if (j.ok && j.done) { var s = li.querySelector('.sure'); if (s) s.remove(); li.classList.add('done'); result(li, j.words, 'ok'); return; }
        if (j.note === 'busy') { b.disabled = false; result(li, j.words, 'warn'); return; }
        restore(li); result(li, j.words, 'warn');
      }, function(){ li.classList.remove('busy'); b.disabled = false; result(li, 'No connection. Try again.', 'warn'); });
    }
  });
})();
</script>
</body>
</html>
